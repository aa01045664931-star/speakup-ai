<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakUp AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <h2>SpeakUp AI</h2>
      <button onclick="showPage('home')">홈</button>
      <button onclick="showPage('practice')">발표 연습</button>
      <button onclick="showPage('analysis')">AI 분석</button>
      <button onclick="showPage('growth')">성장 기록</button>
    </aside>

    <main class="content">
      
      <section id="home" class="page active">
        <h1>AI 발표 코치 웹앱</h1>
        <p>
          웹캠과 마이크를 활용해 실제 발표처럼 연습하고,<br>
          말하기 습관과 자세를 확인해 발표 자신감을 키우는 웹앱입니다.
        </p>
        <img src="assets/bear-character.jpg" class="character" alt="SpeakUp AI 캐릭터">
        <button class="main-btn" onclick="showPage('practice')">발표 연습 시작</button>
      </section>

      <section id="practice" class="page">
        <h1>발표 연습</h1>
        <p>여기에 웹캠 및 마이크 실행 기능이 들어갈 예정입니다.</p>
      </section>

      <section id="analysis" class="page">
        <h1>AI 발표 코치 피드백</h1>
        
        <div style="margin: 20px 0;">
          <input type="password" id="apiKeyInput" placeholder="발급받은 Gemini API 키를 넣으세요" style="padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px;">
          <button onclick="saveApiKey()" style="padding: 10px; cursor: pointer;">키 저장하기</button>
        </div>

        <button onclick="startAIFeedbackTest()" class="main-btn" style="margin-top: 10px;">
          AI 종합 피드백 받기
        </button>

        <div id="responseArea" style="border: 2px dashed #ccc; padding: 20px; margin-top: 20px; background: #fafafa; border-radius: 8px; white-space: pre-wrap; text-align: left; color: #333;">
          이곳에 곰돌이 AI 코치의 피드백이 나타납니다!
        </div>
      </section>

      <section id="growth" class="page">
        <h1>성장 기록</h1>
        <p>발표 종료 버튼을 누르면 발표 기록이 자동으로 저장됩니다.</p>
        <div id="historyList">
          <div class="growth-box">아직 발표 기록이 없습니다.</div>
        </div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
